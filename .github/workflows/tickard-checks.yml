name: Tickard checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: React / TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      # Temporary one-run helper: recover the npm lockfile after an audited repair.
      - name: Generate repaired lockfile for review
        run: |
          npm audit fix --package-lock-only --ignore-scripts
          echo TICKARD_LOCKFILE_BEGIN
          base64 -w 0 package-lock.json
          echo
          echo TICKARD_LOCKFILE_END
      - name: Audit npm dependencies (high/critical)
        run: npm audit --audit-level=high
      - name: TypeScript and production build
        run: npm run build
      - name: Lint
        run: npm run lint

  backend:
    name: Laravel full test suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, sqlite3, pdo_sqlite, fileinfo, intl
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Audit Composer locked dependencies
        run: composer audit --locked --no-interaction
      - name: Configure test application
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Run all Laravel tests
        run: php artisan test
